name: Android

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Release build signed with the template's debug key: fine for testing, NOT for the Play Store.
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk meter-log.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: meter-log.apk
          if-no-files-found: error

  screenshots:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      # main -> android-screenshots; fix/foo -> android-screenshots-fix-foo
      - name: Publish screenshots to a branch
        if: always() && github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = main ]; then TARGET=android-screenshots; else TARGET="android-screenshots-${BRANCH//\//-}"; fi
          mkdir -p screenshots && cd screenshots
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "Android emulator screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          body: |
            Android APK built by GitHub Actions. It is signed with a debug key: install it for testing only.
